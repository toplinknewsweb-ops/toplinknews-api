services:
  - type: web
    name: toplinknews
    runtime: node
    region: ohio               # closest to most US readers; options: oregon, virginia, frankfurt, singapore
    plan: free                 # upgrade to starter ($7/mo) for always-on (no spin-down delay)
    branch: main               # or master — whichever your GitHub default branch is

    buildCommand: npm install
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

    # Auto-deploy every time you push to GitHub
    autoDeploy: true

    # Render pings this path to confirm the site is up
    healthCheckPath: /

    # Custom domain (uncomment and fill in when ready)
    # domains:
    #   - toplinknews.com
    #   - www.toplinknews.com

    # Pages served by this app
    # index.html     — homepage
    # about.html     — about page
    # advertise.html — rate card + contact form
    # privacy.html   — privacy policy
    # dmca.html      — DMCA policy
    # sitemap.xml    — auto-generated by server.js
    # robots.txt     — auto-generated by server.js
